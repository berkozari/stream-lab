      properties:
        videoId:
          type: string
          format: uuid
        uploadId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - UPLOADED
            - QUEUED
      required:
        - videoId
        - uploadId
        - status
    Playback:
      type: object
      properties:
        videoId:
          type: string
          format: uuid
        protocol:
          type: string
