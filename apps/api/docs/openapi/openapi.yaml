        manifestUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      required:
        - videoId
        - protocol
        - manifestUrl
        - expiresAt
    WatchProgressRequest:
      type: object
      properties:
        positionSeconds:
          type: integer
          minimum: 0
